# Solar Filament Segmentation - Baseline Configuration
project:
  name: "solar-filament-segmentation"
  experiment_name: "baseline-unet-resnet34"
  seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "outputs"
  train_split: 0.8
  val_split: 0.2

preprocessing:
  image_size: [512, 512]
  in_channels: 1
  normalization: "minmax"  # options: minmax, percentile, standardize

model:
  architecture: "Unet"
  encoder_name: "resnet34"
  encoder_weights: null  # set only after explicitly caching ImageNet weights
  in_channels: 1
  classes: 1
  activation: null  # returns raw logits for loss functions

training:
  epochs: 30
  batch_size: 8
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
    smooth: 1.0
    pos_weight: 30.0  # foreground is sparse in 512 px patches
  scheduler:
    name: "CosineAnnealingLR"
    t_max: 30
    eta_min: 0.000001
  mixed_precision: true
  early_stopping_patience: 7

postprocessing:
  mask_threshold: 0.5
  instance_method: "watershed"  # options: connected_components, watershed
  core_threshold: 0.7
  min_instance_area: 50
